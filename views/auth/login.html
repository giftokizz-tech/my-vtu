<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VTU Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
    <style>
        .return-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: blue
            color: #495057;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        
        .return-btn:hover {
            background-color: #e9ecef;
            color: #007bff;
            border-color: #007bff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="return-btn">← Return Home</a>
                       <a href="index.html">   <img style="height: 75px; width: 200px; border-radius: 15px;" src="https://i.postimg.cc/Sx7Y9k7P/file-000000006bb871f88cc2e554a8fd2f40(2).png" alt="logo"></a>
                            <h2 class="fw-bold text-primary">
                              <strong class="text-muted"> Sgin In</strong>
                            </h2>
                            <p class="text-muted">Welcome back! Please sign in to your account</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username or Email</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter your username or email" required>
                            </div>
                            <div class="mb-3 position-relative">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                                <button type="button" class="btn btn-outline-secondary position-absolute end-0 top-50 translate-middle-y me-2" id="togglePassword" style="height: 40px; width: 40px; padding: 0; border: none; background: transparent;">
                                    <i class="fas fa-eye" id="passwordToggleIcon"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none text-primary">Forgot password?</a>
                            </div>
                            <div id="loginMessage" class="alert d-none"></div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                    <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                                    Sign In
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-semibold">Sign up here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/auth.js"></script>
</body>
</html>
